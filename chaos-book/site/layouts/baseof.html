<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
{{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
<script>
(function () {
  var saved = localStorage.getItem("theme");
  if (saved === "light" || saved === "dark") {
    document.documentElement.setAttribute("data-theme", saved);
  }
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  /* Violet accent: this book's identity, distinct from the sky-blue GFD textbook. */
  :root { --ink: #1e1b2e; --muted: #6b6580; --accent: #6d28d9; --accent-soft: #f5f3ff;
          --rule: #e6e1f2; --paper: #fff; --card: #faf9ff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #e9e6f2; --muted: #9c94b3; --accent: #c4b5fd;
      --accent-soft: #241b3d; --rule: #342c4a; --paper: #141020; --card: #1c1730; }
    :root:not([data-theme="light"]) code { background: #241d38; }
  }
  :root[data-theme="dark"] { --ink: #e9e6f2; --muted: #9c94b3; --accent: #c4b5fd;
    --accent-soft: #241b3d; --rule: #342c4a; --paper: #141020; --card: #1c1730; }
  :root[data-theme="dark"] code { background: #241d38; }
  body { margin: 0; color: var(--ink); background: var(--paper);
         font: 17px/1.65 Georgia, 'Times New Roman', serif; overflow-x: hidden; }
  header.site { border-bottom: 1px solid var(--rule); font-family: system-ui, sans-serif; }
  header.site .inner, main, footer.site .inner { max-width: 46rem; margin: 0 auto; padding: 0.7rem 1.2rem; }
  header.site .inner { display: flex; align-items: center; flex-wrap: wrap; gap: 0.2rem; }
  body.home main { max-width: 64rem; }
  header.site a { color: var(--accent); text-decoration: none; margin-right: 1rem; }
  .theme-toggle { margin-left: auto; background: none; border: 1px solid var(--rule); border-radius: 6px;
    width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .theme-toggle svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: var(--muted);
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: none; }
    :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: block; }
  }
  main { padding: 1.5rem 1.2rem 3rem; }
  h1, h2, h3 { font-family: system-ui, sans-serif; line-height: 1.25; }
  a { color: var(--accent); }
  table { border-collapse: collapse; font-size: 0.92rem; }
  th, td { border: 1px solid var(--rule); padding: 0.35rem 0.65rem; text-align: left; }
  code { font-size: 0.85em; background: var(--accent-soft); padding: 0.1em 0.3em; border-radius: 3px; }
  blockquote { border-left: 3px solid var(--accent); margin: 1.4rem 0; padding: 0.2rem 0 0.2rem 1.1rem;
    color: var(--muted); }
  .wide { overflow-x: auto; }

  /* -- notebook embed -- */
  .marimo-embed { margin: 1.5rem 0; }
  .marimo-embed button { font: 600 1rem system-ui, sans-serif; color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; padding: 0.9rem 1.4rem; cursor: pointer; width: 100%; }
  :root[data-theme="dark"] .marimo-embed button { color: #1a1030; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .marimo-embed button { color: #1a1030; }
  }
  .marimo-embed button small { display: block; font-weight: 400; opacity: 0.85; margin-top: 0.25rem; }
  .marimo-embed iframe { width: 100%; height: 920px; border: 1px solid var(--rule); border-radius: 8px; }

  /* -- chapter metadata strip -- */
  .chapter-meta { font: 0.82rem/1.5 system-ui, sans-serif; color: var(--muted);
    border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 6px;
    background: var(--card); padding: 0.7rem 0.9rem; margin: 0 0 1.6rem;
    display: flex; flex-wrap: wrap; gap: 0.35rem 1.4rem; }
  .chapter-meta span strong { color: var(--ink); font-weight: 600; }
  .status-pill { font: 600 0.65rem system-ui, sans-serif; text-transform: uppercase;
    letter-spacing: 0.05em; border-radius: 999px; padding: 0.2em 0.65em; white-space: nowrap; }
  .status-live { color: #fff; background: var(--accent); }
  :root[data-theme="dark"] .status-live { color: #1a1030; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .status-live { color: #1a1030; }
  }
  .status-planned { color: var(--muted); border: 1px dashed var(--rule); background: transparent; }
  .planned-note { border: 1px dashed var(--rule); border-radius: 8px; background: var(--card);
    padding: 1.1rem 1.2rem; margin: 1.5rem 0; font: 0.95rem/1.6 system-ui, sans-serif;
    color: var(--muted); }
  .planned-note strong { color: var(--ink); }

  /* -- front page -- */
  .hero { padding: 1rem 0 2.5rem; }
  .hero-motif { width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
    height: 260px; overflow: hidden; }
  .hero-motif img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .hero-motif-caption { text-align: center; font: 0.78rem system-ui, sans-serif; color: var(--muted);
    margin: 0.5rem 0 0; }
  .hero-text h1 { font-size: 2.1rem; margin: 0 0 0.6rem; }
  .hero-text > p { font-size: 1.1rem; color: var(--muted); max-width: 42rem; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.3rem; }
  .btn { font: 600 0.95rem system-ui, sans-serif; text-decoration: none; border-radius: 8px;
    padding: 0.8rem 1.3rem; display: inline-block; }
  .btn-primary { color: #fff; background: var(--accent); }
  :root[data-theme="dark"] .btn-primary { color: #1a1030; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn-primary { color: #1a1030; }
  }
  .btn-secondary { color: var(--accent); background: transparent; border: 1px solid var(--rule); }

  .part-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    gap: 1.2rem; margin-top: 1rem; }
  .part-card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 1.2rem 1.3rem; }
  .part-card h2 { font-size: 1.05rem; margin: 0 0 0.5rem; display: flex; align-items: baseline;
    gap: 0.5rem; flex-wrap: wrap; }
  .part-card h2 a { text-decoration: none; }
  .badge { font: 600 0.65rem system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 0.15em 0.6em; }
  .part-desc { font-size: 0.92rem; color: var(--muted); margin: 0 0 0.8rem; line-height: 1.5; }
  .chapter-list { list-style: none; margin: 0; padding: 0; font-family: system-ui, sans-serif;
    font-size: 0.88rem; }
  .chapter-list li { margin: 0.32rem 0; display: flex; align-items: baseline; gap: 0.4rem; }
  .chapter-list a { text-decoration: none; }
  .chapter-list a:hover { text-decoration: underline; }
  .chapter-list .dot { color: var(--accent); font-size: 0.7em; line-height: 1.6; }
  .chapter-list .dot-planned { color: var(--rule); }
  .map-link { margin-top: 2rem; font-family: system-ui, sans-serif; font-size: 0.95rem; }

  @media (max-width: 640px) {
    .hero-text h1 { font-size: 1.6rem; }
    .hero-motif { height: 190px; }
    .part-grid { grid-template-columns: 1fr; }
    .marimo-embed iframe { height: 680px; }
  }
</style>
</head>
<body{{ if .IsHome }} class="home"{{ end }}>
<header class="site">
  <div class="inner">
    <a href="{{ site.Home.RelPermalink }}"><strong>Chaos &amp; Predictability</strong></a>
    <a href="{{ "notation" | relURL }}/">Notation</a>
    <a href="{{ "how-to-run" | relURL }}/">How to run</a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>
      </svg>
    </button>
  </div>
</header>
<script>
(function () {
  var btn = document.getElementById("theme-toggle");
  function current() {
    var attr = document.documentElement.getAttribute("data-theme");
    if (attr) return attr;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });
})();
</script>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site">
  <div class="inner">
    Notebooks execute in your browser via <a href="https://marimo.io">marimo</a> +
    <a href="https://pyodide.org">Pyodide</a> — nothing is computed on a server.
    Source on <a href="https://github.com/anichaospred/anichaospred.github.io">GitHub</a>.
  </div>
</footer>
</body>
</html>
