[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaoslib"
version = "0.1.0"
description = "Shared Pyodide-safe primitives for the Interactive Chaos and Predictability textbook"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "plotly"]

[tool.setuptools]
packages = ["chaoslib"]
